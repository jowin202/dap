services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dap
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dap:${POSTGRES_PASSWORD}@db/dap
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      REFRESH_EXPIRE_DAYS: ${REFRESH_EXPIRE_DAYS:-30}
      FILES_DIR: /data/files
    volumes:
      - ./volumes/file-storage:/data/files
    # Nur lokal gebunden – der externe Reverse Proxy leitet hierher weiter
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
